name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build proxy binaries
        run: |
          mkdir -p dist
          cd proxy
          GOOS=linux   GOARCH=amd64 go build -o ../dist/llmatrix-proxy_linux_amd64   ./cmd/llmatrix-proxy
          GOOS=darwin  GOARCH=amd64 go build -o ../dist/llmatrix-proxy_darwin_amd64  ./cmd/llmatrix-proxy
          GOOS=windows GOARCH=amd64 go build -o ../dist/llmatrix-proxy_windows_amd64.exe ./cmd/llmatrix-proxy
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
