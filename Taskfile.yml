version: '3'

vars:
  MODULES: sdk engine proxy

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  tidy:
    desc: Run go mod tidy in all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go mod tidy

  test:
    desc: Run unit tests in all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go test ./...

  vet:
    desc: Run go vet in all modules
    cmds:
      - for: { var: MODULES }
        cmd: cd {{.ITEM}} && go vet ./...

  fmt:
    desc: Format all Go sources
    cmds:
      - gofmt -w -s .

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  build:proxy:
    desc: Build llmatrix-proxy binary
    dir: proxy
    cmds:
      - go build -o bin/llmatrix-proxy ./cmd/llmatrix-proxy

  integration:
    desc: Run cross-module integration tests
    dir: tests/integration
    cmds:
      - go test ./...

  e2e:
    desc: Run end-to-end tests
    dir: tests/e2e
    cmds:
      - go test ./...
